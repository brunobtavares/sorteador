<div class="main">
  <button
    class="btn-exit p-2 d-flex justify-content-between"
    aria-label="Fechar sorteador"
    (click)="onClose.emit()"
    type="button"
  >
    X
  </button>
  <div
    class="winner-box d-flex text-center justify-content-center align-items-center"
  >
    <div
      class="winner"
      [ngClass]="{ 'glowing-text': showWinner }"
      aria-atomic="true"
      aria-live="polite"
      role="status"
    >
      {{ winner }}
    </div>
  </div>
  <div class="d-flex justify-content-center">
    <button
      class="btn btn-success"
      [disabled]="loading || remainingItems.length === 0"
      (click)="randomizer()"
      type="button"
    >
      Sortear sem repetir
    </button>
  </div>
</div>
